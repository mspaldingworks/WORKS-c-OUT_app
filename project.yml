name: WorksCout
options:
  bundleIdPrefix: com.mspaldingworks
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

# Local.xcconfig supplies WORKS_COUT_API_TOKEN. Gitignored and machine-local, so
# the token is baked into every build without anyone remembering a flag.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  WorksCoutCore:
    path: WorksCoutCore

targets:
  WorksCout:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Platforms/iOS
      - path: Features/App
    dependencies:
      - package: WorksCoutCore
    info:
      path: Platforms/iOS/Info.plist
      properties:
        CFBundleDisplayName: WORKS(c)OUT
        WorksCoutAPIToken: $(WORKS_COUT_API_TOKEN)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Its own bundle id, so iOS treats this as a separate app from Family
        # Appily rather than an update to it.
        PRODUCT_BUNDLE_IDENTIFIER: com.mspaldingworks.WorksCout
        PRODUCT_NAME: WorksCout
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MNR8M8K86K

  WorksCoutMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Platforms/macOS
      - path: Features/App
    dependencies:
      - package: WorksCoutCore
    info:
      path: Platforms/macOS/Info.plist
      properties:
        CFBundleDisplayName: WORKS(c)OUT
        WorksCoutAPIToken: $(WORKS_COUT_API_TOKEN)
        LSUIElement: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mspaldingworks.WorksCoutMac
        PRODUCT_NAME: "WORKS(c)OUT"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MNR8M8K86K
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    entitlements:
      path: Platforms/macOS/WorksCout.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

schemes:
  WorksCout:
    build:
      targets:
        WorksCout: all
    run:
      config: Debug
    test:
      config: Debug
  WorksCoutMac:
    build:
      targets:
        WorksCoutMac: all
    run:
      config: Debug
